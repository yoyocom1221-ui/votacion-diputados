<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Inicio - Votación</title>

<style>
body{
font-family:Arial;
text-align:center;
background:#f4f4f4;
margin-top:100px;
}

button{
padding:15px 30px;
font-size:18px;
cursor:pointer;
}
</style>
</head>

<body>

<h1>Sistema de Votación</h1>

<button onclick="loginGoogle()">Iniciar sesión con Google</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyAcsuZ-oZCrQ81XNF-945h4d2msKtBN8uM",
authDomain: "votacion-diputados.firebaseapp.com",
databaseURL: "https://votacion-diputados-default-rtdb.firebaseio.com",
projectId: "votacion-diputados",
storageBucket: "votacion-diputados.appspot.com",
messagingSenderId: "56652176884",
appId: "1:56652176884:web:2a50622dea3dc814a72da1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

window.loginGoogle = function(){

signInWithPopup(auth,provider)
.then(()=>{
window.location="votacion.html";
})
.catch((error)=>{
alert(error.message);
});

}

</script>

</body>
</html>
