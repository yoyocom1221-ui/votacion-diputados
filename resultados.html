```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Resultados</title>

<style>

body{
font-family: Arial;
text-align:center;
background:#f2f2f2;
}

.provincia{
background:white;
margin:10px;
padding:10px;
border-radius:8px;
}

button{
padding:10px;
margin:10px;
}

</style>

</head>

<body>

<h1>Resultados</h1>

<button onclick="borrarResultados()">Borrar resultados</button>

<div id="resultados"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
apiKey: "AIzaSyAcsuZ-oZCrQ81XNF-945h4d2msKtBN8uM",
authDomain: "votacion-diputados.firebaseapp.com",
databaseURL: "https://votacion-diputados-default-rtdb.firebaseio.com",
projectId: "votacion-diputados",
storageBucket: "votacion-diputados.appspot.com",
messagingSenderId: "56652176884",
appId: "1:56652176884:web:2a50622dea3dc814a72da1"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const cont=document.getElementById("resultados");

const votosRef=ref(db,"votos");

onValue(votosRef,(snapshot)=>{

cont.innerHTML="";

const datos=snapshot.val();

if(!datos){
cont.innerHTML="No hay votos aún";
return;
}

for(const provincia in datos){

const div=document.createElement("div");

div.className="provincia";

div.innerHTML=`
<h3>${provincia}</h3>
<p>SI: ${datos[provincia].si}</p>
<p>NO: ${datos[provincia].no}</p>
`;

cont.appendChild(div);

}

});

window.borrarResultados=function(){

if(confirm("¿Borrar todos los votos?")){
remove(votosRef);
}

}

</script>

</body>
</html>
```
